<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200" />
    <title>OG Image — Habit Swap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            background: #030108; /* Deeper, richer nearly black */
            font-family: 'Inter', sans-serif;
            position: relative;
        }

        /* Enhanced ambient lighting */
        .ambient-light-1 {
            position: absolute;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            width: 1000px;
            height: 600px;
            background: radial-gradient(ellipse at 50% 0%, rgba(118, 48, 226, 0.6) 0%, rgba(67, 20, 180, 0.15) 40%, transparent 70%);
            pointer-events: none;
            mix-blend-mode: screen;
        }

        .ambient-light-2 {
            position: absolute;
            bottom: -200px;
            right: -100px;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.15) 0%, transparent 60%);
            pointer-events: none;
        }

        /* Finer, more technical grid */
        .grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
        }

        /* Horizontal editorial rule */
        .rule {
            position: absolute;
            left: 80px;
            right: 80px;
            top: 50%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        }

        .content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 96px;
            z-index: 10;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 18px;
            border-radius: 999px;
            border: 1px solid rgba(167, 139, 250, 0.3);
            background: rgba(88, 28, 135, 0.15);
            backdrop-filter: blur(8px);
            margin-bottom: 32px;
            width: fit-content;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.15);
        }

        .pill-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #a78bfa;
            box-shadow: 0 0 10px #a78bfa, 0 0 2px #fff;
        }

        .pill span {
            color: #ddd6fe;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 84px;
            line-height: 0.95;
            letter-spacing: -0.04em;
            margin-bottom: 28px;
        }

        .line1 {
            color: #fff;
            display: block;
            text-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }

        .line2 {
            display: block;
            background: linear-gradient(135deg, #f3e8ff 0%, #d8b4fe 40%, #9333ea 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 16px rgba(147, 51, 234, 0.4));
        }

        p {
            color: rgba(221, 214, 254, 0.6);
            font-size: 22px;
            font-weight: 400;
            line-height: 1.5;
            max-width: 600px;
            margin-bottom: 48px;
            text-wrap: balance;
        }

        .bottom-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(4px);
        }

        .badge span {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        /* Glass Mockup Illustration overlay */
        .glass-element {
            position: absolute;
            right: 120px;
            top: 50%;
            transform: translateY(-50%);
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            box-shadow: inset 0 0 40px rgba(167, 139, 250, 0.1), 0 24px 60px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }
        
        .glass-inner-ring {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: 2px dashed rgba(167, 139, 250, 0.2);
            animation: rotate 60s linear infinite;
        }

        /* Logo — top-right */
        .logo {
            position: absolute;
            top: 56px;
            right: 80px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 20;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #d8b4fe 0%, #9333ea 50%, #4c1d95 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(147, 51, 234, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.3);
        }

        .logo-icon svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .logo-name {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 20px;
            color: #fff;
            letter-spacing: -0.02em;
        }

        /* Rating bottom-right */
        .rating {
            position: absolute;
            bottom: 56px;
            right: 80px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            z-index: 20;
        }

        .stars {
            color: #facc15;
            font-size: 16px;
            letter-spacing: 2px;
            filter: drop-shadow(0 0 8px rgba(250, 204, 21, 0.3));
        }

        .rating span {
            color: rgba(167, 139, 250, 0.5);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.05em;
        }
    </style>
</head>

<body>
    <div class="ambient-light-1"></div>
    <div class="ambient-light-2"></div>
    <div class="grid"></div>
    <div class="rule"></div>
    
    <div class="glass-element">
        <div class="glass-inner-ring"></div>
    </div>

    <!-- Logo top-right -->
    <div class="logo">
        <div class="logo-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path fill-rule="evenodd"
                    d="M14.615 1.595a.75.75 0 01.359.852L12.982 9.75h7.268a.75.75 0 01.548 1.262l-10.5 11.25a.75.75 0 01-1.272-.71l1.992-7.302H3.75a.75.75 0 01-.548-1.262l10.5-11.25a.75.75 0 01.913-.143z"
                    clip-rule="evenodd" />
            </svg>
        </div>
        <span class="logo-name">Habit Swap</span>
    </div>

    <!-- Rating bottom-right -->
    <div class="rating">
        <div class="stars">★★★★★</div>
        <span>4.9 · Neuroplasticity engine</span>
    </div>

    <!-- Main content -->
    <div class="content">
        <div class="pill">
            <div class="pill-dot"></div>
            <span>Neuroscience-Backed Methodology</span>
        </div>

        <h1>
            <span class="line1">Master your</span>
            <span class="line2">dopamine loops.</span>
        </h1>

        <p>
            Habit Swap leverages neuroscience to disrupt negative behavior cycles. 
            Intercept the urge and rewire your brain with a single tap.
        </p>

        <div class="bottom-row">
            <div class="badge">
                <span>✦ Dopamine tracking</span>
            </div>
            <div class="badge">
                <span>✦ Focus retention</span>
            </div>
            <div class="badge">
                <span>✦ Private by design</span>
            </div>
        </div>
    </div>

    <!--
    HOW TO USE:
    1. Open this file in Chrome at exactly 1200px wide (use DevTools device emulation → set 1200×630)
    2. Screenshot the full page
    3. Save as /public/og-image.png in your project
    4. The index.html meta tags already reference /og-image.png — you're done.

    For WhatsApp specifically:
    - WhatsApp fetches OG images from the server at share time
    - Image must be publicly accessible at your domain (not localhost)
    - Minimum 300×200, ideal 1200×630 (what we generated)
    - After deploying, test at: https://www.opengraph.xyz
  -->
</body>

</html>

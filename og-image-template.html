<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200" />
    <title>OG Image — Habit Swap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            background: #000;
            font-family: 'Inter', sans-serif;
            position: relative;
        }

        /* Violet bloom top-centre */
        .bloom-top {
            position: absolute;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            height: 500px;
            background: radial-gradient(ellipse at 50% 0%, rgba(88, 28, 135, 0.70) 0%, transparent 65%);
            pointer-events: none;
        }

        /* Secondary bloom bottom-right */
        .bloom-br {
            position: absolute;
            bottom: -60px;
            right: -60px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(67, 20, 180, 0.20) 0%, transparent 70%);
            pointer-events: none;
        }

        /* Grid texture */
        .grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 56px 56px;
            pointer-events: none;
        }

        /* Horizontal editorial rule */
        .rule {
            position: absolute;
            left: 80px;
            right: 80px;
            top: 50%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
        }

        .content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 96px;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 999px;
            border: 1px solid rgba(139, 92, 246, 0.22);
            background: rgba(88, 28, 135, 0.20);
            margin-bottom: 28px;
            width: fit-content;
        }

        .pill-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 8px rgba(52, 211, 153, 0.9);
        }

        .pill span {
            color: rgba(196, 181, 253, 0.8);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 78px;
            line-height: 0.92;
            letter-spacing: -0.03em;
            margin-bottom: 24px;
        }

        .line1 {
            color: #fff;
            display: block;
        }

        .line2 {
            display: block;
            background: linear-gradient(135deg, #f3e8ff 0%, #fff 30%, #c4b5fd 60%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: rgba(196, 181, 253, 0.45);
            font-size: 20px;
            font-weight: 300;
            line-height: 1.6;
            max-width: 560px;
            margin-bottom: 40px;
        }

        .bottom-row {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .badge {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 22px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            background: rgba(255, 255, 255, 0.03);
        }

        .badge-icon {
            width: 20px;
            height: 20px;
            color: rgba(167, 139, 250, 0.6);
        }

        .badge span {
            color: rgba(255, 255, 255, 0.40);
            font-size: 13px;
            font-weight: 500;
        }

        /* Logo — top-right */
        .logo {
            position: absolute;
            top: 44px;
            right: 80px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 18px rgba(139, 92, 246, 0.45);
        }

        .logo-icon svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        .logo-name {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 18px;
            color: #fff;
        }

        /* Stars */
        .stars {
            color: #facc15;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* Bottom-left rating */
        .rating {
            position: absolute;
            bottom: 44px;
            right: 80px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .rating .stars {
            font-size: 13px;
        }

        .rating span {
            color: rgba(167, 139, 250, 0.35);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.05em;
        }
    </style>
</head>

<body>
    <div class="bloom-top"></div>
    <div class="bloom-br"></div>
    <div class="grid"></div>
    <div class="rule"></div>

    <!-- Logo top-right -->
    <div class="logo">
        <div class="logo-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path fill-rule="evenodd"
                    d="M14.615 1.595a.75.75 0 01.359.852L12.982 9.75h7.268a.75.75 0 01.548 1.262l-10.5 11.25a.75.75 0 01-1.272-.71l1.992-7.302H3.75a.75.75 0 01-.548-1.262l10.5-11.25a.75.75 0 01.913-.143z"
                    clip-rule="evenodd" />
            </svg>
        </div>
        <span class="logo-name">Habit Swap</span>
    </div>

    <!-- Rating bottom-right -->
    <div class="rating">
        <div class="stars">★★★★★</div>
        <span>4.9 · 2,000+ early users</span>
    </div>

    <!-- Main content -->
    <div class="content">
        <div class="pill">
            <div class="pill-dot"></div>
            <span>Free on iOS & Android</span>
        </div>

        <h1>
            <span class="line1">Your brain is</span>
            <span class="line2">stuck in a loop.</span>
        </h1>

        <p>
            Habit Swap intercepts the urge the moment it hits —
            and rewires your brain with one tap.
        </p>

        <div class="bottom-row">
            <div class="badge">
                <span>✦ Free forever</span>
            </div>
            <div class="badge">
                <span>✦ No ads ever</span>
            </div>
            <div class="badge">
                <span>✦ Backed by neuroscience</span>
            </div>
        </div>
    </div>

    <!--
    HOW TO USE:
    1. Open this file in Chrome at exactly 1200px wide (use DevTools device emulation → set 1200×630)
    2. Screenshot the full page
    3. Save as /public/og-image.png in your project
    4. The index.html meta tags already reference /og-image.png — you're done.

    For WhatsApp specifically:
    - WhatsApp fetches OG images from the server at share time
    - Image must be publicly accessible at your domain (not localhost)
    - Minimum 300×200, ideal 1200×630 (what we generated)
    - After deploying, test at: https://www.opengraph.xyz
  -->
</body>

</html>

    <!-- ── JSON-LD Structured Data for Google SEO ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Habit Swap",
      "applicationCategory": "HealthAndFitnessApplication",
      "operatingSystem": "iOS, Android, Web",
      "description": "Habit Swap intercepts your urges to engage in bad habits, providing science-backed, random alternative tasks to rewire your brain and promote dopamine detox.",
      "url": "https://habitswap.fit/",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Habit Swap",
      "url": "https://habitswap.fit/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://habitswap.fit/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How does Habit Swap help break bad habits?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Habit Swap intercepts your urges the moment they hit and provides you with a random, science-backed healthy alternative task. This process interrupts the habitual loop, replacing bad habits with positive dopamine-releasing activities to effectively rewire your brain over time."
          }
        },
        {
          "@type": "Question",
          "name": "What is a dopamine detox and how can an app help?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A dopamine detox involves taking a break from highly stimulating activities like excessive social media, junk food, or gaming to reset your brain's reward system. Habit Swap aids this process by offering constructive micro-tasks that provide a healthier, natural dopamine hit, reducing your reliance on negative addictions."
          }
        },
        {
          "@type": "Question",
          "name": "Is Habit Swap free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Habit Swap offers a core experience that is free to use."
          }
        }
      ]
    }
    </script>
